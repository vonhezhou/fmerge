name: Desktop checks
on:
  push:
  pull_request:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libglu1-mesa-dev libx11-dev
      - run: flutter --no-version-check pub get
      - run: python tool/check.py --build
      - run: python tool/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: fmerge-${{ matrix.target }}
          path: dist/*
